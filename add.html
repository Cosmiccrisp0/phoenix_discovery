<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add new item</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f4f0;
      color: #1a1a1a;
      min-height: 100vh;
      padding-bottom: 2rem;
    }

    .topbar {
      background: #fff;
      border-bottom: 1px solid #e5e3dd;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar a { font-size: 20px; text-decoration: none; color: #555; }
    .topbar h1 { font-size: 17px; font-weight: 500; }

    .form-wrap { padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }

    .field { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 12px; font-weight: 500; color: #666; text-transform: uppercase; letter-spacing: 0.04em; }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      background: #fff;
      color: #1a1a1a;
      appearance: none;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #1a56db;
      box-shadow: 0 0 0 3px rgba(26,86,219,0.1);
    }
    textarea { min-height: 90px; resize: vertical; }

    .photo-box {
      border: 2px dashed #ccc;
      border-radius: 12px;
      background: #fff;
      padding: 2rem 1rem;
      text-align: center;
      cursor: pointer;
      position: relative;
    }
    .photo-box input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .photo-icon { font-size: 32px; margin-bottom: 8px; }
    .photo-label { font-size: 14px; color: #888; }
    .photo-sub { font-size: 12px; color: #bbb; margin-top: 4px; }

    .preview-row {
      display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px;
    }
    .preview-row img {
      width: 72px; height: 72px; object-fit: cover; border-radius: 8px;
      border: 1px solid #ddd;
    }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .condition-row {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    }
    .cond-btn {
      padding: 0.6rem;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fff;
      font-size: 13px;
      text-align: center;
      cursor: pointer;
      color: #555;
    }
    .cond-btn.active { border-color: #1a56db; background: #e8f0fe; color: #1a56db; }

    .status-row {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
    }
    .status-btn {
      padding: 0.65rem;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fff;
      font-size: 13px;
      text-align: center;
      cursor: pointer;
      color: #555;
    }
    .status-btn.active { border-color: #1a56db; background: #e8f0fe; color: #1a56db; }

    .divider {
      height: 1px; background: #e5e3dd; margin: 0.25rem 0;
    }
    .section-label {
      font-size: 11px; font-weight: 500; color: #aaa;
      text-transform: uppercase; letter-spacing: 0.06em;
    }

    .save-btn {
      width: 100%;
      padding: 1rem;
      background: #1a56db;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .save-btn:hover { background: #1447c0; }

    /* Success overlay */
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .overlay.show { display: flex; }
    .success-card {
      background: #fff;
      border-radius: 20px;
      padding: 2rem 1.5rem;
      text-align: center;
      max-width: 300px;
      width: 90%;
    }
    .success-icon { font-size: 48px; margin-bottom: 12px; }
    .success-title { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
    .success-sub { font-size: 14px; color: #888; margin-bottom: 1.5rem; line-height: 1.6; }
    .success-actions { display: flex; flex-direction: column; gap: 10px; }
    .btn-primary {
      padding: 0.8rem;
      background: #1a56db;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: block;
    }
    .btn-secondary {
      padding: 0.8rem;
      background: #fff;
      color: #1a56db;
      border: 1px solid #1a56db;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      text-decoration: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="index.html">←</a>
    <h1>Add new item</h1>
  </div>

  <div class="form-wrap">

    <!-- Photo upload -->
    <div class="field">
      <label>Photos</label>
      <div class="photo-box" id="photo-box">
        <input type="file" accept="image/*" multiple capture="environment"
               id="photo-input" onchange="previewPhotos(this)">
        <div class="photo-icon">📷</div>
        <div class="photo-label">Tap to take photos</div>
        <div class="photo-sub">or choose from gallery · up to 4</div>
      </div>
      <div class="preview-row" id="preview-row"></div>
    </div>

    <div class="divider"></div>
    <div class="section-label">Item details</div>

    <!-- Name -->
    <div class="field">
      <label>Item name</label>
      <input type="text" id="name" placeholder="e.g. Victorian parlor chair">
    </div>

    <!-- Category + Unit -->
    <div class="row-2">
      <div class="field">
        <label>Category</label>
        <select id="category">
          <option value="">Select...</option>
          <option>Chair</option>
          <option>Table</option>
          <option>Cabinet</option>
          <option>Mirror</option>
          <option>Lamp</option>
          <option>Dresser</option>
          <option>Sofa</option>
          <option>Artwork</option>
          <option>Decor</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field">
        <label>Storage unit</label>
        <select id="unit">
          <option value="">Select...</option>
          <option>Unit A</option>
          <option>Unit B</option>
        </select>
      </div>
    </div>

    <!-- Era + Material -->
    <div class="row-2">
      <div class="field">
        <label>Era / decade</label>
        <input type="text" id="era" placeholder="e.g. 1920s">
      </div>
      <div class="field">
        <label>Material</label>
        <input type="text" id="material" placeholder="e.g. Oak">
      </div>
    </div>

    <!-- Condition -->
    <div class="field">
      <label>Condition</label>
      <div class="condition-row">
        <div class="cond-btn" onclick="selectCondition(this)">Good</div>
        <div class="cond-btn" onclick="selectCondition(this)">Fair</div>
        <div class="cond-btn" onclick="selectCondition(this)">Needs work</div>
      </div>
    </div>

    <div class="divider"></div>
    <div class="section-label">Financials</div>

    <!-- Prices -->
    <div class="row-2">
      <div class="field">
        <label>Paid ($)</label>
        <input type="number" id="paid" placeholder="0.00">
      </div>
      <div class="field">
        <label>Asking ($)</label>
        <input type="number" id="asking" placeholder="0.00">
      </div>
    </div>

    <!-- Status -->
    <div class="field">
      <label>Status</label>
      <div class="status-row">
        <div class="status-btn active" onclick="selectStatus(this)">Available</div>
        <div class="status-btn" onclick="selectStatus(this)">Refurbishing</div>
        <div class="status-btn" onclick="selectStatus(this)">On hold</div>
        <div class="status-btn" onclick="selectStatus(this)">Sold</div>
      </div>
    </div>

    <div class="divider"></div>
    <div class="section-label">Notes</div>

    <!-- Refurb notes -->
    <div class="field">
      <label>Refurb notes</label>
      <textarea id="refurb" placeholder="What needs doing? e.g. strip varnish, replace hardware..."></textarea>
    </div>

    <!-- History / research -->
    <div class="field">
      <label>History &amp; research</label>
      <textarea id="history" placeholder="What did you find out about this piece?"></textarea>
    </div>

    <!-- Date found -->
    <div class="field">
      <label>Date acquired</label>
      <input type="date" id="date">
    </div>

    <!-- Save -->
    <button class="save-btn" onclick="saveItem()">Save item</button>

  </div>

  <!-- Success overlay -->
  <div class="overlay" id="overlay">
    <div class="success-card">
      <div class="success-icon">✅</div>
      <div class="success-title">Item saved!</div>
      <div class="success-sub">Added to your collection. Ready to log another piece or head back to the dashboard?</div>
      <div class="success-actions">
        <a class="btn-primary" href="add.html">Add another item</a>
        <a class="btn-secondary" href="index.html">Back to dashboard</a>
      </div>
    </div>
  </div>

  <script>
    // Set today's date as default
    document.getElementById('date').valueAsDate = new Date();

    // Photo preview
    function previewPhotos(input) {
      const row = document.getElementById('preview-row');
      row.innerHTML = '';
      const files = Array.from(input.files).slice(0, 4);
      files.forEach(file => {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        row.appendChild(img);
      });
      if (files.length > 0) {
        document.querySelector('.photo-label').textContent = files.length + ' photo(s) selected';
      }
    }

    // Condition selector
    function selectCondition(el) {
      document.querySelectorAll('.cond-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }

    // Status selector
    function selectStatus(el) {
      document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }

    // Save — shows confirmation for now, real backend comes later
    function saveItem() {
      const name = document.getElementById('name').value.trim();
      if (!name) {
        alert('Give the item a name first.');
        document.getElementById('name').focus();
        return;
      }
      document.getElementById('overlay').classList.add('show');
    }
  </script>

</body>
</html>
